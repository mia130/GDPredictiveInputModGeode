name: Build Geode mod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows .geode for Geode v6
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build mod with the official Geode action
        id: build
        uses: geode-sdk/build-geode-mod@61a56c697aea9655e3f31c6c1b83870431f30434
        with:
          sdk: 6.0.0-alpha.1
          target: Win64
          build-config: RelWithDebInfo

      - name: Upload compiled .geode
        uses: actions/upload-artifact@v4
        with:
          name: predictive-input-geode
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
