name: Build Geode mod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Geode SDK and build tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'TOOLS'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          git clone --depth 1 --branch v6.0.0-alpha.1 --recurse-submodules https://github.com/geode-sdk/geode.git (Join-Path $tools 'geode-sdk-v6')
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar el SDK de Geode v6.' }

          git clone --depth 1 https://github.com/geode-sdk/bindings.git (Join-Path $tools 'geode-bindings')
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron descargar los bindings.' }

          $cliZip = Join-Path $tools 'geode-cli.zip'
          Invoke-WebRequest 'https://github.com/geode-sdk/cli/releases/download/v4.0.0/geode-cli-v4.0.0-win.zip' -OutFile $cliZip
          $cliDir = Join-Path $tools 'geode-cli'
          Expand-Archive -Path $cliZip -DestinationPath $cliDir -Force

          $cli = Get-ChildItem $cliDir -Recurse -Filter geode.exe | Select-Object -First 1
          if (-not $cli) { throw 'No se encontró geode.exe dentro del archivo del CLI.' }
          if ($cli.DirectoryName -ne $cliDir) {
            Copy-Item $cli.FullName (Join-Path $cliDir 'geode.exe') -Force
          }

          "TOOLS=$tools" >> $env:GITHUB_ENV
          "GEODE_SDK=$(Join-Path $tools 'geode-sdk-v6')" >> $env:GITHUB_ENV
          "GEODE_BINDINGS_REPO_PATH=$(Join-Path $tools 'geode-bindings')" >> $env:GITHUB_ENV

                - name: Install Geode loader binaries
        shell: pwsh
        run: |
          & "$env:TOOLS\geode-cli\geode.exe" sdk install-binaries --platform win
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron instalar los binarios precompilados del loader de Geode.' }
          
      - name: Compile .geode
        shell: cmd
        run: build.bat

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: predictive-input-geode
          path: build/**/*.geode
          if-no-files-found: error
